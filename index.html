<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOM - Kanban Operation Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>KOM - Kanban Operation Management</h1>
        <h3>Organizza e gestisci le tue attività</h3>
    </header>

    <main>
        <section id="nuova-attivita">
            <h2>Nuova attività</h2>

            <form id="kanban-board">
                <input
                    type="text"
                    id="titolo"
                    placeholder="Titolo dell'attività"
                    required
                >

                <select id="priorita">
                    <option value="bassa">Bassa</option>
                    <option value="media" selected>Media</option>
                    <option value="alta">Alta</option>
                </select>

                <input
                    type="text"
                    id="operatore"
                    placeholder="Operatore assegnato"
                    required
                >

                <button type="submit">Aggiungi</button>
            </form>
        </section>

        <br>
<table>
  <tr>
    <th id="titolo-da-fare">Da fare <span id="count-da-fare">(0)</span></th>
    <th id="titolo-in-corso">In corso <span id="count-in-corso">(0)</span></th>
    <th id="titolo-completata">Completata <span id="count-completata">(0)</span></th>
  </tr>
  <tr>
    <td><div id="da-fare"></div></td>
    <td><div id="in-corso"></div></td>
    <td><div id="completata"></div></td>
  </tr>
</table>

<label for="filtro">Filtra per priorità:</label>
<select id="filtro">
    <option value="tutte">Tutte</option>
    <option value="bassa">Bassa</option>
    <option value="media">Media</option>
    <option value="alta">Alta</option>
</select>

<button type="button" id="reset">Reset</button>

<script src="script.js"></script>
    </main>
</body>
</html>
